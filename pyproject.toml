[project]
name = "yabibf"
version = "0.1.3"
description = "Yet Another BIBliography Formatter"
authors = [{ name = "Marcel Bollmann", email = "marcel@bollmann.me" }]
requires-python = ">=3.11,<3.15"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "bibtexparser",
    "citeproc-py>=0.9.0,<1",
    "citeproc-py-styles>=0.1.3,<0.2; python_version < '3.12'",
    "lxml>=6.1.0,<7",
    "setuptools<81 ; python_full_version < '3.12'",
]

[tool.black]
line-length = 90
target-version = ['py311', 'py312', 'py313']
skip-string-normalization = false

[dependency-groups]
dev = [
    "black>=23.3.0,<24",
    "pytest>=9.0.3,<10",
    "ruff>=0.0.272,<0.0.273",
]

[tool.ruff]
ignore = ['E501']  # "Line too long" is black's job
target-version = 'py313'

[tool.uv]
default-groups = "all"

[tool.uv.sources]
bibtexparser = { git = "https://github.com/sciunto-org/python-bibtexparser" }

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
